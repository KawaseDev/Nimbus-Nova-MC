plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'nimbus_nova' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion

    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

sourceSets {
    missionTest {
        compileClasspath = sourceSets.main.output
        runtimeClasspath = output + compileClasspath
    }
}

tasks.register('missionSelfTest', JavaExec) {
    dependsOn missionTestClasses
    classpath = sourceSets.missionTest.runtimeClasspath
    mainClass = 'cc.nimbusnova.mc.mission.MissionStateTest'
    enableAssertions = true
}

check.dependsOn missionSelfTest

tasks.register('contentAssetTest', JavaExec) {
    dependsOn missionTestClasses
    classpath = sourceSets.missionTest.runtimeClasspath
    mainClass = 'cc.nimbusnova.mc.content.ContentAssetTest'
    enableAssertions = true
}

check.dependsOn contentAssetTest

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'nimbus-nova-client-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}

jar {
    def projectName = project.name
    inputs.property 'projectName', projectName

    from('LICENSE') {
        rename { "${it}_${projectName}" }
    }
    from('CREDITS.md')
}
