plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'nimbus_nova' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

if (providers.gradleProperty('marsHeightmap').isPresent()) {
    def terrainPath = file(providers.gradleProperty('marsHeightmap').get()).absolutePath
    loom.runs.configureEach {
        property 'nimbusnova.marsHeightmap', terrainPath
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion

    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

sourceSets {
    missionTest {
        compileClasspath = sourceSets.main.output
        runtimeClasspath = output + compileClasspath
    }
}

tasks.register('missionSelfTest', JavaExec) {
    dependsOn missionTestClasses
    classpath = sourceSets.missionTest.runtimeClasspath
    mainClass = 'cc.nimbusnova.mc.mission.MissionStateTest'
    enableAssertions = true
}

check.dependsOn missionSelfTest

