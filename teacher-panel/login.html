<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher sign in | Nimbus Nova</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0c1422; color: #edf3fb; }
    * { box-sizing: border-box; }
    main { max-width: 420px; margin: 12vh auto; padding: 28px; }
    h1 { margin-bottom: 28px; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 6px; }
    input, button { font: inherit; border-radius: 8px; padding: 12px; }
    input { border: 1px solid #40546b; background: #142236; color: inherit; }
    button { cursor: pointer; border: 0; background: #83dbcc; color: #0c1422; font-weight: 700; }
    .secondary { background: transparent; color: #83dbcc; border: 1px solid #40546b; }
    #error { color: #ffb4a9; min-height: 1.5em; margin: 0; }
  </style>
</head>
<body>
<main>
  <h1>Teacher sign in</h1>
  <form id="form">
    <label>Username <input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_.-]+"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="256"></label>
    <p id="error" role="alert"></p>
    <button type="submit">Sign in</button>
    <button type="button" class="secondary" id="register">Create account</button>
  </form>
</main>
<script>
  const form = document.getElementById('form');
  async function submit(action) {
    if (!form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form));
    try {
      const response = await fetch(`/api/account/${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      const result = await response.json();
      if (!response.ok) { document.getElementById('error').textContent = result.error; return; }
      location.reload();
    } catch { document.getElementById('error').textContent = 'Connection failed'; }
  }
  form.addEventListener('submit', (event) => { event.preventDefault(); submit('login'); });
  document.getElementById('register').addEventListener('click', () => submit('register'));
</script>
</body>
</html>
